name: Frontend CI/CD

on:
  pull_request:
    branches: [ dev, main ]
  push:
    branches: [ dev, main ]

env:
  PROJECT_ID: nxup-dev
  REGION: us-central1
  SERVICE_NAME: nxup-frontend

jobs:
  # --- PR Validation (Lint, Type-check, Unit/Integration Tests) ---
  lint-typecheck-test:
    name: PR Checks (Lint, Type Check, Unit/Integration Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test -- --ci --coverage

  # --- Build and Deploy to Cloud Run (dev branch only) ---
  build-and-deploy:
    name: Build & Deploy to Cloud Run (dev)
    needs: lint-typecheck-test
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Build & Push Image
        run: |
          gcloud builds submit \
            --tag gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated

  # --- Post-deploy Smoke Tests ---
  smoke-tests:
    name: Post-deploy Playwright Smoke Tests
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps

      - name: Run Playwright smoke tests against Cloud Run
        env:
          PLAYWRIGHT_BASE_URL: https://${{ env.SERVICE_NAME }}-${{ github.sha }}-uc.a.run.app
        run: |
          npm run e2e
